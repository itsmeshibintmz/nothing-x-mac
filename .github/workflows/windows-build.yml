# Builds the Windows installer on a real Windows machine.
#
# Runs on every push to `main` or `windows`, on version tags, or by hand from
# the Actions tab ("Run workflow"). The installer (named for a release) and a
# portable .exe are attached to the run as downloadable artifacts. Builds are
# not code-signed.

name: Windows build

on:
  push:
    branches: [main, windows]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rust is preinstalled on the runner; make sure it is current.
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:windows

      # Copy this version's installer under its release name. Exact file
      # names, because the cached build folder can hold older installers.
      - name: Name the installer for release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/Nothing X Windows_${version}_x64-setup.exe" "release-files/Nothing-X-Windows-${version}-x64-setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nothing-x-windows-installer
          path: release-files/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: nothing-x-windows-portable
          path: src-tauri/target/release/Nothing X Windows.exe
          if-no-files-found: error
